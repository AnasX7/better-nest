name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck, Build & Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (Oxfmt)
        run: bun run format:check

      - name: Run linter (Oxlint)
        run: bun run lint

      - name: Run TypeScript typecheck (Turbo)
        run: bun run check-types

      - name: Build applications (Turbo)
        run: bun run build

      - name: Run unit & e2e tests (Turbo)
        run: |
          bun run test
          bun run test:e2e
