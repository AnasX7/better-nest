name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (Oxfmt)
        run: bun run format:check

      - name: Run linter (Oxlint)
        run: bun run lint

      - name: Run TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Build application (Rspack)
        run: bun run build

      - name: Run unit tests (Vitest)
        run: bun run test

      - name: Run E2E tests (Vitest)
        run: bun run test:e2e
