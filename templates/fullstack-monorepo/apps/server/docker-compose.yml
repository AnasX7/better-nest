services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nest_db
      BETTER_AUTH_SECRET: 'production-secret-key-at-least-32-chars-long'
      BETTER_AUTH_URL: 'http://localhost:3000'
      TRUSTED_ORIGINS: 'http://localhost:3000,http://localhost:5173'
      ENABLE_DOCS: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
